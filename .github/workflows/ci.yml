# Third-party Actions pinned to immutable commit SHAs (supply-chain hygiene).
# Style aligned with rmems/corinth-canal and Limen-Neural/* CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CPU-only research path; avoid requiring LiquidCortex GPU packages in CI.
  LIMEN_RESERVOIR: naut_core

jobs:
  rust:
    name: Rust (execution)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: execution
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0 (MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          # Pin exact version so CI verifies declared rust-version = "1.99"
          # rather than a floating `stable` channel.
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache Cargo + target
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: execution -> target
          shared-key: limen-capital-execution-cache
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked -- --nocapture

      - name: Test shared Alpaca harness
        run: cargo test --locked --features live-alpaca

      - name: Build and test each optional library feature
        run: |
          for feature in kinetic snn corpus-ipc axon-encoder plasticity-lab; do
            cargo build --locked --no-default-features --features "$feature"
            cargo test --locked --no-default-features --features "$feature"
          done

  julia:
    name: Julia ${{ matrix.julia-version }} (brain CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.13']
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0

      # Resolve gate: proves brain/Project.toml is installable (UUIDs, registry
      # membership, compat, git [sources]). Pkg.resolve() downloads package
      # sources and eager artifacts (budgeted here; CUDA runtime artifacts are
      # lazy and never fetched) but does not precompile. Writes a throwaway
      # Manifest. A fresh CI depot has no registry, so add General first.
      - name: Resolve brain Project.toml
        run: |
          julia --color=yes --project=. -e 'using Pkg; Pkg.Registry.add("General"); Pkg.resolve()'
        working-directory: brain
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"

      # Unit tests only need Test + Random + local includes.
      # Skip full Project.toml instantiate (CUDA / DuckDB / LiquidCortex are heavy
      # and optional for the CPU wire/encoder suite).
      - name: Run Capital unit tests
        run: |
          julia --color=yes --project=. test/runtests.jl
        working-directory: brain

      - name: Test pinned CPU forecast adapter and comparison
        env:
          JULIA_NUM_PRECOMPILE_TASKS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  # Structure + validated dependency sources (no full GPU instantiate).
  integration:
    name: Integration structure gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [rust, julia]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.99.0

      - name: Cache Cargo + target
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: execution -> target
          shared-key: limen-capital-execution-cache
          cache-on-failure: true

      - name: Run test_integration.sh
        run: ./test_integration.sh
