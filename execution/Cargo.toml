[package]
name = "spikenaut-execution-engine"
version = "0.1.0"
edition = "2021"
# CI pins Rust 1.98.1; declared MSRV floor is 1.98.
rust-version = "1.98"
description = "Limen-Capital Rust muscle — ZMQ signal consumer, gates, metabolic-ledger ghost execution"
license = "MIT"

[dependencies]
# Validated git+rev library pins — no sibling path clones
metabolic-ledger = { git = "https://github.com/rmems/metabolic-ledger", rev = "91822f842c13b0a2b5d8d7b75160933fab2459d6" }
# MarketPulse/ReadoutPacket: in-tree `src/binary_wire.rs` until corpus-ipc publishes them.

# Optional validated packages (enable via features)
kinetic-signals = { git = "https://github.com/rmems/kinetic-signals", rev = "ccc883107e6763969179f036ac33ae22dffdc865", optional = true }
# neuromod has no rmems transfer; still hosted at Limen-Neural
neuromod = { git = "https://github.com/Limen-Neural/neuromod", rev = "2a548da6006fedb732b07491b69023476b0cc339", optional = true }

# ZMQ bridge for Julia → Rust signal flow
zmq = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime for market feed ingestion
tokio = { version = "1", features = ["full"] }

# HTTP client for dydx API
reqwest = { version = "0.11", features = ["json"] }

# Logging and tracing for latency monitoring
tracing = "0.1"
tracing-subscriber = "0.3"

# Time precision for nanosecond latency tracking
chrono = "0.4"

# Market feed connectivity
bytes = "1.5"

# --- live-robinhood (feature-gated; off by default; RM-2436) ---
# Ed25519 request signing for the Robinhood Crypto Trading API
ed25519-dalek = { version = "2.1", optional = true }
base64 = { version = "0.22", optional = true }
# client_order_id idempotency keys
uuid = { version = "1", features = ["v4", "serde"], optional = true }
# Backoff jitter + synthetic paper quotes
rand = { version = "0.8", optional = true }
# LiveConfig TOML
toml = { version = "0.8", optional = true }

[features]
default = []
# Streaming Hawkes / surprise features from kinetic-signals
kinetic = ["dep:kinetic-signals"]
# Reference LIF primitives (research helpers)
snn = ["dep:neuromod"]
# Live micro-capital experiment: Robinhood Crypto adapter + decision loop (RM-2436).
# Off by default so `cargo build` compiles no new dependencies.
live-robinhood = ["dep:ed25519-dalek", "dep:base64", "dep:uuid", "dep:rand", "dep:toml"]

[[bin]]
name = "train_ghost"
path = "src/bin/train_ghost.rs"

[[bin]]
name = "market_sim"
path = "src/bin/market_sim.rs"

# RM-2436 live micro-capital experiment (feature-gated)
[[bin]]
name = "limen-live"
path = "src/bin/limen_live.rs"
required-features = ["live-robinhood"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
