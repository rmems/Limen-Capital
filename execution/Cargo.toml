[package]
name = "limen-execution"
version = "0.1.0"
edition = "2021"
# CI pins Rust 1.99.0 to verify the declared MSRV.
rust-version = "1.99"
description = "Limen-Capital Rust muscle — ZMQ signal consumer, gates, metabolic-ledger ghost execution"
license = "MIT"

[dependencies]
# Validated git+rev library pins — no sibling path clones
metabolic-ledger = { git = "https://github.com/rmems/metabolic-ledger", rev = "825d6a9a8683356104e856dd22d31d8cb22dae1b" }
# Wire contracts remain in-tree at `src/binary_wire.rs`; IPC migration is separate.

# Optional published packages (enable via features; resolved versions in Cargo.lock)
kinetic-signals = { version = "0.5.0", optional = true }
neuromod = { version = "0.7.0", optional = true }
corpus-ipc = { version = "0.2.1", optional = true }
axon-encoder = { version = "0.6.0", optional = true }
plasticity-lab = { version = "0.2.1", optional = true }

# ZMQ bridge for Julia → Rust signal flow
zmq = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime for market feed ingestion
tokio = { version = "1", features = ["full"] }

# HTTP client for dydx API
reqwest = { version = "0.11", features = ["json"] }

# Logging and tracing for latency monitoring
tracing = "0.1"
tracing-subscriber = "0.3"

# Time precision for nanosecond latency tracking
chrono = "0.4"

# Market feed connectivity
bytes = "1.5"

# Runtime tradeable universe (`config/universe.toml`)
toml = "0.8"

# --- live-robinhood (feature-gated; off by default; RM-2436) ---
# Ed25519 request signing for the Robinhood Crypto Trading API
ed25519-dalek = { version = "2.1", optional = true }
base64 = { version = "0.22", optional = true }
# client_order_id idempotency keys
uuid = { version = "1", features = ["v4", "serde"], optional = true }
# Backoff jitter + synthetic paper quotes
rand = { version = "0.8", optional = true }
[features]
default = []
# Streaming Hawkes / surprise features from kinetic-signals
kinetic = ["dep:kinetic-signals"]
# Reference LIF primitives (research helpers)
snn = ["dep:neuromod"]
# Dependency adoption only; runtime IPC/encoder/STDP wiring is separate.
corpus-ipc = ["dep:corpus-ipc"]
axon-encoder = ["dep:axon-encoder"]
plasticity-lab = ["dep:plasticity-lab"]
# Live micro-capital experiment: Robinhood Crypto adapter + decision loop (RM-2436).
# Off by default so `cargo build` compiles no new dependencies.
live-robinhood = ["dep:ed25519-dalek", "dep:base64", "dep:uuid", "dep:rand"]

[[bin]]
name = "train_ghost"
path = "src/bin/train_ghost.rs"

[[bin]]
name = "market_sim"
path = "src/bin/market_sim.rs"

# RM-2436 live micro-capital experiment (feature-gated)
[[bin]]
name = "limen-live"
path = "src/bin/limen_live.rs"
required-features = ["live-robinhood"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
serial_test = "3"
