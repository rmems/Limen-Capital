[package]
name = "spikenaut-execution-engine"
version = "0.1.0"
edition = "2021"
description = "Limen-Capital Rust muscle — ZMQ signal consumer, gates, metabolic-ledger ghost execution"
license = "MIT"

[dependencies]
# Limen-Neural: ATP-gated ghost wallet
metabolic-ledger = { path = "../../Limen-Neural/metabolic-ledger" }

# Limen-Neural: binary wire types (MarketPulse / ReadoutPacket)
corpus-ipc = { path = "../../Limen-Neural/corpus-ipc" }

# Optional Limen-Neural packages (enable via features)
kinetic-signals = { path = "../../Limen-Neural/kinetic-signals", optional = true }
neuromod = { path = "../../Limen-Neural/neuromod", optional = true }

# ZMQ bridge for Julia → Rust signal flow
zmq = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime for market feed ingestion
tokio = { version = "1", features = ["full"] }

# HTTP client for dydx API
reqwest = { version = "0.11", features = ["json"] }

# Logging and tracing for latency monitoring
tracing = "0.1"
tracing-subscriber = "0.3"

# Time precision for nanosecond latency tracking
chrono = "0.4"

# Market feed connectivity
bytes = "1.5"

[features]
default = []
# Streaming Hawkes / surprise features from Limen-Neural
kinetic = ["dep:kinetic-signals"]
# ZMQ backends inside corpus-ipc (optional; builds vendored libzmq)
ipc-zmq = ["corpus-ipc/zmq"]
# Reference LIF primitives (research helpers)
snn = ["dep:neuromod"]

[[bin]]
name = "train_ghost"
path = "src/bin/train_ghost.rs"

[[bin]]
name = "market_sim"
path = "src/bin/market_sim.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
