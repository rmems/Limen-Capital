[package]
name = "spikenaut-execution-engine"
version = "0.1.0"
edition = "2021"
# CI pins Rust 1.97.1; declared MSRV floor is 1.97.
rust-version = "1.97"
description = "Limen-Capital Rust muscle — ZMQ signal consumer, gates, metabolic-ledger ghost execution"
license = "MIT"

[dependencies]
# Limen-Neural (validated, git+rev only — no sibling path clones)
metabolic-ledger = { git = "https://github.com/Limen-Neural/metabolic-ledger", rev = "91822f842c13b0a2b5d8d7b75160933fab2459d6" }
# MarketPulse/ReadoutPacket: in-tree `src/binary_wire.rs` until corpus-ipc publishes them.

# Optional Limen-Neural packages (enable via features)
kinetic-signals = { git = "https://github.com/Limen-Neural/kinetic-signals", rev = "b00a35afe7d26b24af5b82684c795ed9745f6138", optional = true }
neuromod = { git = "https://github.com/Limen-Neural/neuromod", rev = "2a548da6006fedb732b07491b69023476b0cc339", optional = true }

# ZMQ bridge for Julia → Rust signal flow
zmq = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime for market feed ingestion
tokio = { version = "1", features = ["full"] }

# HTTP client for dydx API
reqwest = { version = "0.11", features = ["json"] }

# Logging and tracing for latency monitoring
tracing = "0.1"
tracing-subscriber = "0.3"

# Time precision for nanosecond latency tracking
chrono = "0.4"

# Market feed connectivity
bytes = "1.5"

[features]
default = []
# Streaming Hawkes / surprise features from Limen-Neural
kinetic = ["dep:kinetic-signals"]
# Reference LIF primitives (research helpers)
snn = ["dep:neuromod"]

[[bin]]
name = "train_ghost"
path = "src/bin/train_ghost.rs"

[[bin]]
name = "market_sim"
path = "src/bin/market_sim.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
